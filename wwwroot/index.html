<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Wolf Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

            .logo img {
                width: 80px;
                height: 80px;
                object-fit: contain;
                filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.5));
            }

            .logo h1 {
                font-size: 28px;
                margin-top: 16px;
                background: linear-gradient(135deg, #ef4444, #dc2626);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .logo p {
                color: #6b7280;
                font-size: 14px;
                margin-top: 4px;
            }

        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.2s;
            border-radius: 8px;
        }

            .auth-tab.active {
                color: #ef4444;
                background: rgba(239, 68, 68, 0.1);
            }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .form-group label {
                font-size: 14px;
                font-weight: 500;
                color: #9ca3af;
            }

            .form-group input, .form-group textarea {
                background: #1a1a1a;
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                padding: 12px 16px;
                color: #e0e0e0;
                font-size: 14px;
                transition: all 0.2s;
            }

                .form-group input:focus, .form-group textarea:focus {
                    outline: none;
                    border-color: #dc2626;
                    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
                }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 10px 20px -5px rgba(220, 38, 38, 0.4);
            }

        .btn-secondary {
            background: #2a2a2a;
            color: #e0e0e0;
        }

            .btn-secondary:hover {
                background: #3a3a3a;
            }

        .error-message {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: #ef4444;
            font-size: 14px;
            text-align: center;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: #22c55e;
            font-size: 14px;
            text-align: center;
        }

        .app-container {
            display: none;
            height: 100vh;
            overflow: hidden;
        }

            .app-container.active {
                display: flex;
            }

        .sidebar {
            width: 320px;
            background: #0f0f0f;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .sidebar-header img {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                object-fit: cover;
                cursor: pointer;
                border: 2px solid #dc2626;
            }

            .sidebar-header h3 {
                flex: 1;
                font-size: 16px;
                cursor: pointer;
            }

                .sidebar-header h3:hover {
                    color: #ef4444;
                }

        .logout-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 20px;
            transition: color 0.2s;
        }

            .logout-btn:hover {
                color: #ef4444;
            }

        .btn-new-chat {
            margin: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

            .btn-new-chat:hover {
                transform: translateY(-1px);
                box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
            }

        .btn-create-group {
            margin: 0 12px 12px 12px;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #dc2626;
            border-radius: 12px;
            color: #e0e0e0;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

            .btn-create-group:hover {
                background: #dc2626;
                color: white;
            }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-item {
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            background: #141414;
            border: 1px solid #202020;
        }

            .chat-item:hover {
                background: #1a1a1a;
                border-color: #dc2626;
            }

            .chat-item.active {
                background: linear-gradient(135deg, #1a0a0a, #141414);
                border-color: #dc2626;
            }

        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-preview {
            font-size: 12px;
            color: #6b7280;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-badge {
            font-size: 10px;
            background: #dc2626;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #121212;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            background: #0f0f0f;
        }

            .chat-header h2 {
                font-size: 18px;
                color: #ef4444;
            }

            .chat-header p {
                font-size: 12px;
                color: #6b7280;
                margin-top: 4px;
            }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            position: relative;
        }

            .message.own {
                align-self: flex-end;
            }

            .message.system {
                align-self: center;
                max-width: 90%;
                font-style: italic;
                color: #6b7280;
                font-size: 12px;
            }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

            .message-header img {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                object-fit: cover;
            }

        .message-sender {
            font-size: 12px;
            font-weight: 500;
            color: #9ca3af;
        }

        .message-content {
            padding: 10px 14px;
            border-radius: 18px;
            background: #1a1a1a;
            word-wrap: break-word;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }

        .message.system .message-content {
            background: #1a1a1a;
            color: #6b7280;
            font-style: italic;
        }

        .message-time {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
            margin-left: 4px;
        }

        .message-actions {
            position: absolute;
            right: -40px;
            top: 0;
            display: none;
            gap: 8px;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-actions button {
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

            .message-actions button:hover {
                background: #dc2626;
                color: white;
            }

        .message-input-area {
            padding: 20px;
            border-top: 1px solid #2a2a2a;
            background: #0f0f0f;
            display: flex;
            gap: 12px;
        }

            .message-input-area input {
                flex: 1;
                background: #1a1a1a;
                border: 1px solid #2a2a2a;
                border-radius: 24px;
                padding: 12px 20px;
                color: #e0e0e0;
                font-size: 14px;
            }

                .message-input-area input:focus {
                    outline: none;
                    border-color: #dc2626;
                }

            .message-input-area button {
                background: #dc2626;
                border: none;
                border-radius: 50%;
                width: 48px;
                height: 48px;
                cursor: pointer;
                transition: all 0.2s;
            }

                .message-input-area button:hover {
                    background: #b91c1c;
                    transform: scale(1.05);
                }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 40px;
        }

        .typing-indicator {
            font-size: 12px;
            color: #6b7280;
            padding: 8px 20px;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            .modal.active {
                display: flex;
            }

        .modal-content {
            background: #141414;
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(220, 38, 38, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

            .modal-content h3 {
                margin-bottom: 20px;
                color: #ef4444;
            }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .user-search-result {
            padding: 12px;
            border-radius: 12px;
            background: #1a1a1a;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .user-search-result:hover {
                background: #2a2a2a;
                border-left: 3px solid #dc2626;
            }

            .user-search-result.selected {
                background: #dc2626;
                color: white;
            }

            .user-search-result img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                object-fit: cover;
            }

        .selected-members {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .member-tag {
            background: #dc2626;
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .member-tag button {
                background: none;
                border: none;
                color: white;
                cursor: pointer;
                font-size: 14px;
            }

        .profile-avatar {
            text-align: center;
            margin-bottom: 24px;
        }

            .profile-avatar img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid #dc2626;
                cursor: pointer;
            }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .info-label {
            color: #6b7280;
            font-weight: 500;
        }

        .info-value {
            color: #e0e0e0;
        }

        .code-input {
            letter-spacing: 4px;
            font-size: 24px;
            text-align: center;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo">
                <img src="/logo.png" alt="Red Wolf" onerror="this.style.display='none'">
                <h1>Red Wolf</h1>
                <p>Secure Messenger</p>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Login (Phone or Name)</label>
                    <input type="text" id="loginLogin" placeholder="Enter your login">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">Login →</button>
                <div id="loginError" class="error-message" style="display: none;"></div>
            </div>

            <!-- REGISTER FORM - STEP 1 -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="+79991234567">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="regName" placeholder="Your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Min 6 characters">
                </div>
                <button class="btn btn-primary" onclick="requestVerificationCode()">Send Code →</button>
                <div id="registerError" class="error-message" style="display: none;"></div>
            </div>

            <!-- REGISTER FORM - STEP 2 (VERIFICATION) -->
            <div id="verifyForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="verifyCode" class="code-input" placeholder="Enter 6-digit code" maxlength="6">
                </div>
                <button class="btn btn-primary" onclick="verifyAndRegister()">Verify & Register →</button>
                <button class="btn btn-secondary" onclick="backToRegister()">← Back</button>
                <div id="verifyError" class="error-message" style="display: none;"></div>
                <div id="verifySuccess" class="success-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="sidebar-header">
                <img id="sidebarAvatar" src="/api/User/avatar/default" alt="Avatar" onclick="showProfileModal()">
                <h3 id="currentUserName" onclick="showProfileModal()">Loading...</h3>
                <button class="logout-btn" onclick="logout()">🚪</button>
            </div>

            <button class="btn-new-chat" onclick="showNewChatModal()">+ New Chat</button>
            <button class="btn-create-group" onclick="showCreateGroupModal()">👥 Create Group</button>

            <div class="chats-list" id="chatsList">
                <div class="empty-state">Loading chats...</div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h2>Select a chat</h2>
                <p>Choose conversation to start messaging</p>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">No messages yet</div>
            </div>
            <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
            <div class="message-input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                <button onclick="sendMessage()" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <div class="modal" id="newChatModal">
        <div class="modal-content">
            <h3>New Private Chat</h3>
            <div class="form-group">
                <label>Search by username</label>
                <input type="text" id="searchUserInput" placeholder="Enter username..." oninput="searchUsers()">
            </div>
            <div id="searchResults" style="max-height: 300px; overflow-y: auto; margin-top: 16px;"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeNewChatModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <h3>Create Group</h3>
            <div class="form-group">
                <label>Group Name</label>
                <input type="text" id="groupName" placeholder="Enter group name">
            </div>
            <div class="form-group">
                <label>Max Users (2-500)</label>
                <input type="number" id="groupMaxUsers" value="100" min="2" max="500">
            </div>
            <div class="form-group">
                <label>Search members</label>
                <input type="text" id="groupSearchInput" placeholder="Search users..." oninput="searchGroupUsers()">
            </div>
            <div id="groupSearchResults" style="max-height: 200px; overflow-y: auto;"></div>
            <div class="selected-members" id="selectedMembers"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="createGroup()">Create Group</button>
                <button class="btn btn-secondary" onclick="closeCreateGroupModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="color: #ef4444;">My Profile</h3>
                <button onclick="closeProfileModal()" style="background: none; border: none; color: #6b7280; font-size: 24px; cursor: pointer;">&times;</button>
            </div>

            <div class="profile-avatar">
                <img id="profileAvatar" src="/api/User/avatar/default" alt="Avatar" onclick="document.getElementById('avatarFileInput').click()">
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="uploadAvatarFromProfile(this)">
                <div style="margin-top: 12px;">
                    <button class="btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="deleteAvatar()">Remove Avatar</button>
                </div>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="profileName" placeholder="Your name">
            </div>

            <div class="form-group">
                <label>New Password (leave empty to keep current)</label>
                <input type="password" id="profileNewPassword" placeholder="New password">
            </div>

            <div class="info-row">
                <span class="info-label">Member since:</span>
                <span class="info-value" id="profileRegisterDate">-</span>
            </div>

            <div class="info-row">
                <span class="info-label">User ID:</span>
                <span class="info-value" id="profileUserId" style="font-size: 11px;">-</span>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="updateProfile()">Save Changes</button>
                <button class="btn btn-secondary" onclick="closeProfileModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editMessageModal">
        <div class="modal-content">
            <h3>Edit Message</h3>
            <div class="form-group">
                <textarea id="editMessageText" rows="3" style="width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px; color: white;"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveEditedMessage()">Save</button>
                <button class="btn btn-secondary" onclick="closeEditMessageModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentChat = null;
        let token = null;
        let connection = null;
        let typingTimeout = null;
        let editingMessageId = null;
        let selectedGroupMembers = [];
        let tempPhoneNumber = null;

        const API_BASE = '/api';

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('loginForm').style.display = 'flex';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('verifyForm').style.display = 'none';
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'flex';
                document.getElementById('verifyForm').style.display = 'none';
            }
            clearErrors();
        }

        function clearErrors() {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('verifyError').style.display = 'none';
            document.getElementById('verifySuccess').style.display = 'none';
        }

        async function requestVerificationCode() {
            const phone = document.getElementById('regPhone').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorDiv = document.getElementById('registerError');

            clearErrors();

            if (!phone || !name || !password) {
                errorDiv.textContent = 'Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/User/request-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, name, password })
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || 'Failed to send code');
                }

                const data = await response.json();
                tempPhoneNumber = data.phoneNumber;

                // Show verification form
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('verifyForm').style.display = 'flex';
                document.getElementById('verifyCode').value = '';

                // Auto-fill code from response (for testing, remove in production)
                if (data.code) {
                    document.getElementById('verifyCode').value = data.code;
                }

                const successDiv = document.getElementById('verifySuccess');
                successDiv.textContent = `Code sent to ${phone}`;
                successDiv.style.display = 'block';

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        async function verifyAndRegister() {
            const code = document.getElementById('verifyCode').value.trim();
            const errorDiv = document.getElementById('verifyError');
            const successDiv = document.getElementById('verifySuccess');

            clearErrors();

            if (!code || code.length !== 6) {
                errorDiv.textContent = 'Please enter 6-digit code';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/User/verify-and-register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: tempPhoneNumber, code: code })
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || 'Verification failed');
                }

                const data = await response.json();

                successDiv.textContent = 'Registration successful! Logging in...';
                successDiv.style.display = 'block';

                // Auto login
                token = data.token;
                currentUser = { id: data.userId };
                localStorage.setItem('token', token);
                localStorage.setItem('userId', data.userId);

                setTimeout(() => {
                    initApp();
                }, 1000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        function backToRegister() {
            document.getElementById('verifyForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'flex';
            clearErrors();
        }

        async function handleLogin() {
            const login = document.getElementById('loginLogin').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            clearErrors();

            if (!login || !password) {
                errorDiv.textContent = 'Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/User/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || 'Login failed');
                }

                const data = await response.json();
                token = data.token;
                currentUser = { id: data.userId };
                localStorage.setItem('token', token);
                localStorage.setItem('userId', data.userId);

                await initApp();
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        async function initApp() {
            if (!token) {
                token = localStorage.getItem('token');
                const userId = localStorage.getItem('userId');
                if (token && userId) currentUser = { id: userId };
                else return;
            }

            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');

            await loadUserProfile();
            await loadChats();
            await initSignalR();
        }

        async function loadUserProfile() {
            try {
                const response = await fetch(`${API_BASE}/User/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    currentUser = { ...currentUser, ...user };
                    document.getElementById('currentUserName').textContent = user.name;
                    updateAvatarImages();
                }
            } catch (error) {
                console.error('Failed to load profile:', error);
            }
        }

        function updateAvatarImages() {
            const avatarUrl = `${API_BASE}/User/avatar/${currentUser.id}?t=${Date.now()}`;
            document.getElementById('sidebarAvatar').src = avatarUrl;
            document.getElementById('profileAvatar').src = avatarUrl;
        }

        async function loadChats() {
            try {
                const response = await fetch(`${API_BASE}/Chat/user-chats/${currentUser.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const chats = await response.json();
                    renderChats(chats);
                }
            } catch (error) {
                console.error('Failed to load chats:', error);
            }
        }

        function renderChats(chats) {
            const container = document.getElementById('chatsList');
            if (!chats || chats.length === 0) {
                container.innerHTML = '<div class="empty-state">No chats yet. Click +New Chat to start!</div>';
                return;
            }

            container.innerHTML = chats.map(chat => {
                const isGroup = chat.maxUsers > 2 || chat.users.length > 2;
                const otherUser = chat.otherUser;
                const avatarUrl = otherUser?.id
                    ? `${API_BASE}/User/avatar/${otherUser.id}`
                    : `${API_BASE}/User/avatar/default`;
                const preview = isGroup ? `${chat.users.length} members` : (chat.otherUser?.name || chat.chatName);

                return `
                        <div class="chat-item" onclick="selectChat('${chat.id}', '${escapeHtml(chat.chatName)}')">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="${avatarUrl}" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #2a2a2a;"
                                     onerror="this.src='${API_BASE}/User/avatar/default'">
                                <div>
                                    <div class="chat-name">
                                        ${escapeHtml(chat.chatName)}
                                        ${isGroup ? '<span class="chat-badge">GROUP</span>' : ''}
                                    </div>
                                    <div class="chat-preview">${escapeHtml(preview)}</div>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        async function selectChat(chatId, chatName) {
            currentChat = { id: chatId, name: chatName };

            document.getElementById('chatHeader').innerHTML = `
                    <h2>${escapeHtml(chatName)}</h2>
                    <p>Chat ID: ${chatId.substring(0, 8)}...</p>
                `;

            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            await loadMessages(chatId);

            if (connection) {
                await connection.invoke('JoinChat', chatId, currentUser.id, currentUser.name);
            }
        }

        async function loadMessages(chatId) {
            try {
                const response = await fetch(`${API_BASE}/Chat/${chatId}/messages?page=1&pageSize=100`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderMessages(data.messages);
                }
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');

            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state">No messages yet. Send the first message!</div>';
                return;
            }

            // СОРТИРУЕМ ПО ВРЕМЕНИ (старые сверху, новые снизу)
            const sortedMessages = [...messages].sort((a, b) =>
                new Date(a.messageCreateDate) - new Date(b.messageCreateDate)
            );

            const messagesHtml = sortedMessages.map(msg => {
                const isSystem = msg.isSystemMessage;
                const avatarUrl = msg.messageCreator?.id && !isSystem
                    ? `${API_BASE}/User/avatar/${msg.userId}`
                    : `${API_BASE}/User/avatar/default`;
                const isOwn = msg.userId === currentUser.id;
                const edited = msg.messageCreateDate !== msg.messageLastUpdateDate;

                if (isSystem) {
                    return `
                <div class="message system">
                    <div class="message-content">📢 ${escapeHtml(msg.messageText)}</div>
                    <div class="message-time">${new Date(msg.messageCreateDate).toLocaleTimeString()}</div>
                </div>
            `;
                }

                return `
            <div class="message ${isOwn ? 'own' : ''}" data-message-id="${msg.messageId}">
                <div class="message-header">
                    <img src="${avatarUrl}" onerror="this.src='${API_BASE}/User/avatar/default'">
                    <span class="message-sender">${escapeHtml(msg.messageCreator?.name || 'Unknown')}</span>
                </div>
                <div class="message-content">${escapeHtml(msg.messageText)}${edited ? ' <span style="font-size: 10px; opacity: 0.6;">(edited)</span>' : ''}</div>
                <div class="message-time">${new Date(msg.messageCreateDate).toLocaleTimeString()}</div>
                ${isOwn && !msg.isDeleted ? `
                    <div class="message-actions">
                        <button onclick="editMessage('${msg.messageId}', '${escapeHtml(msg.messageText)}')">✏️ Edit</button>
                        <button onclick="deleteMessage('${msg.messageId}')">🗑️ Delete</button>
                    </div>
                ` : ''}
            </div>
        `;
            }).join('');

            container.innerHTML = messagesHtml;
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentChat || !currentUser) return;

            try {
                const response = await fetch(`${API_BASE}/Message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        messageText: text,
                        userId: currentUser.id,
                        chatId: currentChat.id
                    })
                });

                if (response.ok) {
                    input.value = '';
                    await loadMessages(currentChat.id);

                    if (connection) {
                        await connection.invoke('SendMessage', currentChat.id, currentUser.id, currentUser.name, text);
                    }
                } else {
                    const error = await response.text();
                    alert('Failed to send message: ' + error);
                }
            } catch (error) {
                console.error('Failed to send message:', error);
                alert('Failed to send message');
            }
        }

        async function editMessage(messageId, currentText) {
            editingMessageId = messageId;
            document.getElementById('editMessageText').value = currentText;
            document.getElementById('editMessageModal').classList.add('active');
        }

        async function saveEditedMessage() {
            const newText = document.getElementById('editMessageText').value.trim();
            if (!newText || !editingMessageId) return;

            try {
                const response = await fetch(`${API_BASE}/Message/${editingMessageId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        messageId: editingMessageId,
                        messageText: newText
                    })
                });

                if (response.ok) {
                    closeEditMessageModal();
                    await loadMessages(currentChat.id);
                } else {
                    const error = await response.text();
                    alert('Failed to edit message: ' + error);
                }
            } catch (error) {
                console.error('Failed to edit message:', error);
                alert('Failed to edit message');
            }
        }

        async function deleteMessage(messageId) {
            if (!confirm('Delete this message?')) return;

            try {
                const response = await fetch(`${API_BASE}/Message/${messageId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    await loadMessages(currentChat.id);
                } else {
                    const error = await response.text();
                    alert('Failed to delete message: ' + error);
                }
            } catch (error) {
                console.error('Failed to delete message:', error);
                alert('Failed to delete message');
            }
        }

        async function searchUsers() {
            const query = document.getElementById('searchUserInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');

            if (query.length < 2) {
                resultsDiv.innerHTML = '<div class="empty-state">Enter at least 2 characters</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/User/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const users = await response.json();
                    const filtered = users.filter(u =>
                        u.name.toLowerCase().includes(query.toLowerCase()) &&
                        u.id !== currentUser.id
                    );

                    if (filtered.length === 0) {
                        resultsDiv.innerHTML = '<div class="empty-state">No users found</div>';
                        return;
                    }

                    resultsDiv.innerHTML = filtered.map(user => `
                            <div class="user-search-result" onclick="createPrivateChat('${user.id}', '${escapeHtml(user.name)}')">
                                <img src="${API_BASE}/User/avatar/${user.id}" onerror="this.src='${API_BASE}/User/avatar/default'">
                                <div>
                                    <strong>${escapeHtml(user.name)}</strong>
                                    <div style="font-size: 12px; color: #6b7280;">Click to start chat</div>
                                </div>
                            </div>
                        `).join('');
                }
            } catch (error) {
                console.error('Search failed:', error);
                resultsDiv.innerHTML = '<div class="empty-state">Search failed</div>';
            }
        }

        async function createPrivateChat(userId, userName) {
            try {
                const response = await fetch(`${API_BASE}/Chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        memberIds: [currentUser.id, userId],
                        maxUsers: 2
                    })
                });

                if (response.ok) {
                    const newChat = await response.json();
                    alert(`Chat with ${userName} created!`);
                    closeNewChatModal();
                    await loadChats();
                    await selectChat(newChat.id, newChat.chatName);
                } else {
                    const error = await response.text();
                    alert('Failed to create chat: ' + error);
                }
            } catch (error) {
                console.error('Failed to create chat:', error);
                alert('Failed to create chat');
            }
        }

        function showCreateGroupModal() {
            selectedGroupMembers = [];
            updateSelectedMembersDisplay();
            document.getElementById('groupName').value = '';
            document.getElementById('groupMaxUsers').value = '100';
            document.getElementById('groupSearchInput').value = '';
            document.getElementById('groupSearchResults').innerHTML = '';
            document.getElementById('createGroupModal').classList.add('active');
        }

        function closeCreateGroupModal() {
            document.getElementById('createGroupModal').classList.remove('active');
        }

        async function searchGroupUsers() {
            const query = document.getElementById('groupSearchInput').value.trim();
            const resultsDiv = document.getElementById('groupSearchResults');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/User/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const users = await response.json();
                    const filtered = users.filter(u =>
                        u.name.toLowerCase().includes(query.toLowerCase()) &&
                        u.id !== currentUser.id &&
                        !selectedGroupMembers.some(m => m.id === u.id)
                    );

                    if (filtered.length === 0) {
                        resultsDiv.innerHTML = '<div class="empty-state">No users found</div>';
                        return;
                    }

                    resultsDiv.innerHTML = filtered.map(user => `
                            <div class="user-search-result" onclick="addGroupMember('${user.id}', '${escapeHtml(user.name)}')">
                                <img src="${API_BASE}/User/avatar/${user.id}" onerror="this.src='${API_BASE}/User/avatar/default'">
                                <div>
                                    <strong>${escapeHtml(user.name)}</strong>
                                </div>
                            </div>
                        `).join('');
                }
            } catch (error) {
                console.error('Search failed:', error);
                resultsDiv.innerHTML = '<div class="empty-state">Search failed</div>';
            }
        }

        function addGroupMember(userId, userName) {
            if (selectedGroupMembers.some(m => m.id === userId)) return;
            selectedGroupMembers.push({ id: userId, name: userName });
            updateSelectedMembersDisplay();
            document.getElementById('groupSearchInput').value = '';
            document.getElementById('groupSearchResults').innerHTML = '';
        }

        function removeGroupMember(userId) {
            selectedGroupMembers = selectedGroupMembers.filter(m => m.id !== userId);
            updateSelectedMembersDisplay();
        }

        function updateSelectedMembersDisplay() {
            const container = document.getElementById('selectedMembers');
            if (selectedGroupMembers.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding: 12px;">No members selected yet</div>';
                return;
            }

            container.innerHTML = selectedGroupMembers.map(member => `
                    <div class="member-tag">
                        ${escapeHtml(member.name)}
                        <button onclick="removeGroupMember('${member.id}')">×</button>
                    </div>
                `).join('');
        }

        async function createGroup() {
            const groupName = document.getElementById('groupName').value.trim();
            const maxUsers = parseInt(document.getElementById('groupMaxUsers').value);

            if (!groupName) {
                alert('Please enter group name');
                return;
            }

            if (selectedGroupMembers.length === 0) {
                alert('Please select at least one member');
                return;
            }

            const memberIds = [currentUser.id, ...selectedGroupMembers.map(m => m.id)];

            try {
                const response = await fetch(`${API_BASE}/Chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        memberIds: memberIds,
                        maxUsers: maxUsers,
                        chatName: groupName
                    })
                });

                if (response.ok) {
                    const newChat = await response.json();
                    alert(`Group "${groupName}" created!`);
                    closeCreateGroupModal();
                    await loadChats();
                    await selectChat(newChat.id, newChat.chatName);
                } else {
                    const error = await response.text();
                    alert('Failed to create group: ' + error);
                }
            } catch (error) {
                console.error('Failed to create group:', error);
                alert('Failed to create group');
            }
        }

        function showNewChatModal() {
            document.getElementById('newChatModal').classList.add('active');
            document.getElementById('searchUserInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }

        function closeNewChatModal() {
            document.getElementById('newChatModal').classList.remove('active');
        }

        function closeEditMessageModal() {
            document.getElementById('editMessageModal').classList.remove('active');
            editingMessageId = null;
        }

        async function showProfileModal() {
            try {
                const response = await fetch(`${API_BASE}/User/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('profileName').value = user.name;
                    document.getElementById('profileRegisterDate').textContent = new Date(user.registerDate).toLocaleDateString();
                    document.getElementById('profileUserId').textContent = user.id;
                    document.getElementById('profileAvatar').src = `${API_BASE}/User/avatar/${user.id}?t=${Date.now()}`;
                    document.getElementById('profileNewPassword').value = '';
                    document.getElementById('profileModal').classList.add('active');
                }
            } catch (error) {
                console.error('Failed to load profile:', error);
                alert('Failed to load profile');
            }
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        async function updateProfile() {
            const newName = document.getElementById('profileName').value.trim();
            const newPassword = document.getElementById('profileNewPassword').value;

            const updateData = {};
            if (newName) updateData.name = newName;
            if (newPassword) updateData.newPassword = newPassword;

            if (Object.keys(updateData).length === 0) {
                closeProfileModal();
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/User/update-profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    const user = await response.json();
                    currentUser.name = user.name;
                    document.getElementById('currentUserName').textContent = user.name;
                    alert('Profile updated successfully!');
                    closeProfileModal();
                } else {
                    const error = await response.text();
                    alert('Failed to update profile: ' + error);
                }
            } catch (error) {
                console.error('Failed to update profile:', error);
                alert('Failed to update profile');
            }
        }

        async function uploadAvatarFromProfile(input) {
            const file = input.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('File too large! Max 5MB');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/User/upload-avatar`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    updateAvatarImages();
                    await loadChats();
                    alert('Avatar updated!');
                } else {
                    const error = await response.text();
                    alert('Failed to upload avatar: ' + error);
                }
            } catch (error) {
                console.error('Failed to upload avatar:', error);
                alert('Failed to upload avatar');
            }
        }

        async function deleteAvatar() {
            if (!confirm('Remove your avatar? It will be replaced with default.')) return;

            try {
                const response = await fetch(`${API_BASE}/User/avatar`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    updateAvatarImages();
                    await loadChats();
                    alert('Avatar removed!');
                } else {
                    const error = await response.text();
                    alert('Failed to remove avatar: ' + error);
                }
            } catch (error) {
                console.error('Failed to delete avatar:', error);
                alert('Failed to delete avatar');
            }
        }

        async function initSignalR() {
            connection = new signalR.HubConnectionBuilder()
                .withUrl("/messengerHub", {
                    accessTokenFactory: () => token
                })
                .withAutomaticReconnect()
                .build();

            connection.on("ReceiveMessage", () => {
                if (currentChat) {
                    loadMessages(currentChat.id);
                }
            });

            try {
                await connection.start();
                console.log("SignalR connected");

                if (currentChat) {
                    await connection.invoke('JoinChat', currentChat.id, currentUser.id, currentUser.name);
                }
            } catch (error) {
                console.error("SignalR connection failed:", error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            token = null;
            currentUser = null;
            currentChat = null;

            if (connection) {
                connection.stop();
            }

            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('loginLogin').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        if (localStorage.getItem('token')) {
            token = localStorage.getItem('token');
            const userId = localStorage.getItem('userId');
            if (userId) {
                currentUser = { id: userId };
                initApp();
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</body>
