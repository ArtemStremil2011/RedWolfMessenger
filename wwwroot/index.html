<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Wolf Messenger</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo"><h1>🐺 Red Wolf</h1><p>Secure & Encrypted Messenger</p></div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">🔐 Login</button>
                <button class="auth-tab" data-tab="register">📝 Register</button>
            </div>
            <div id="loginForm" class="auth-form">
                <div class="form-group"><label>📱 Phone or Username</label><input type="text" id="loginLogin" placeholder="Enter your login"></div>
                <div class="form-group"><label>🔒 Password</label><input type="password" id="loginPassword" placeholder="Enter password"></div>
                <button class="btn btn-primary" id="doLoginBtn">→ Sign In</button>
            </div>
            <div id="registerForm" class="auth-form" style="display:none">
                <div class="form-group"><label>📞 Phone Number</label><input type="tel" id="regPhone" placeholder="+7 (999) 123-45-67"></div>
                <div class="form-group"><label>👤 Name</label><input type="text" id="regName" placeholder="Your username"></div>
                <div class="form-group"><label>🔒 Password (min 6)</label><input type="password" id="regPassword" placeholder="Create password"></div>
                <button class="btn btn-primary" id="sendCodeBtn">📨 Send Verification Code</button>
            </div>
            <div id="verifyForm" class="auth-form" style="display:none">
                <div class="form-group"><label>🔢 Verification Code</label><input type="text" id="verifyCode" placeholder="Enter 6-digit code" maxlength="6"></div>
                <button class="btn btn-primary" id="verifyBtn">✓ Verify & Register</button>
                <button class="btn btn-secondary" id="backToRegisterBtn">← Back</button>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img id="sidebarAvatar" class="sidebar-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
                <h3 id="currentUserName">Loading...</h3>
                <button class="logout-btn" id="logoutBtn" title="Logout">🚪</button>
            </div>
            <button class="btn-new-chat" id="newChatBtn">+ New Private Chat</button>
            <button class="btn-create-group" id="createGroupBtn">👥 Create Group</button>
            <button class="btn-trash" id="trashBtn">🗑️ Trash Bin</button>
            <div class="chats-list" id="chatsList"><div class="empty-state">💬 No chats yet<br>Start a new conversation</div></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader"><h2>✨ Select a chat to start</h2></div>
            <div class="messages-container" id="messagesContainer"><div class="empty-state">💭 No messages yet</div></div>
            <div class="typing-indicator" id="typingIndicator" style="display:none"></div>
            <div class="message-input-area">
                <input type="file" id="fileInput" style="display:none">
                <button class="attach-btn" id="attachBtn" title="Attach file">📎</button>
                <button class="voice-btn" id="voiceBtn" title="Voice message">🎤</button>
                <div class="voice-recording-indicator" id="voiceRecordingIndicator">
                    <span class="dot"></span>
                    <span class="voice-timer" id="voiceTimer">00:00</span>
                    <button class="btn-danger" id="cancelVoiceBtn" style="padding:4px 12px; border-radius:20px; font-size:12px;">✕</button>
                </div>
                <div class="emoji-picker-container"><button class="emoji-btn" id="emojiBtn" title="Emoji">😊</button></div>
                <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                <button class="send-btn" id="sendBtn" disabled title="Send">➤</button>
            </div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div class="modal" id="trashModal">
        <div class="modal-content trash-modal-content">
            <div class="trash-header">
                <h3>🗑️ Trash Bin - <span id="trashChatName"></span></h3>
                <div class="trash-actions">
                    <button class="btn-secondary" id="refreshTrashBtn">🔄 Refresh</button>
                    <button class="btn-secondary close-modal">✖️ Close</button>
                </div>
            </div>
            <div id="deletedMessagesList" style="max-height: 60vh; overflow-y: auto;">
                <div class="empty-state">📭 No deleted messages</div>
            </div>
            <div class="modal-buttons">
                <button class="btn-warning" id="closeTrashBtn">Close</button>
            </div>
        </div>
    </div>

    <div class="modal" id="userProfileModal"><div class="modal-content"><div id="userProfileContent"></div><div class="modal-buttons"><button class="btn btn-secondary close-modal">Close</button></div></div></div>
    <div class="modal" id="newChatModal"><div class="modal-content"><h3>🔍 New Private Chat</h3><div class="form-group"><input type="text" id="searchUserInput" placeholder="Search by username..."></div><div id="searchResults"></div><div class="modal-buttons"><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="createGroupModal"><div class="modal-content"><h3>👥 Create Group</h3><div class="form-group"><input type="text" id="groupName" placeholder="Group name"></div><div class="form-group"><input type="number" id="groupMaxUsers" value="100" placeholder="Max members"></div><div class="form-group"><input type="text" id="groupSearchInput" placeholder="Search members to add..."></div><div id="groupSearchResults"></div><div id="selectedMembers" class="selected-members"></div><div class="modal-buttons"><button class="btn btn-primary" id="createGroupSubmit">✨ Create Group</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="editChatModal"><div class="modal-content"><h3 id="editChatTitle">Edit Chat</h3><div class="form-group"><input type="text" id="editChatName" placeholder="Chat name"></div><div id="groupAvatarSection" style="display:none; text-align:center; margin-bottom:20px;"><img id="groupAvatarPreview" class="group-avatar-img" src=""><div style="margin-top:12px;"><button class="btn-secondary" id="uploadGroupAvatarBtn" style="padding:8px 16px;">📷 Upload Avatar</button><button class="btn-danger" id="deleteGroupAvatarBtn" style="padding:8px 16px; margin-left:8px;">🗑️ Remove</button></div><input type="file" id="groupAvatarFile" accept="image/*" style="display:none"></div><div id="groupMembersSection" style="display:none"><div class="form-group"><input type="text" id="addMemberSearch" placeholder="Add new member..."></div><div id="addMemberResults"></div><div id="membersList"></div></div><div class="modal-buttons"><button class="btn btn-primary" id="saveChatEdit">💾 Save</button><button class="btn btn-danger" id="leaveDeleteBtn">🚪 Leave/Delete</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="profileModal"><div class="modal-content"><h3>👤 My Profile</h3><div style="text-align:center"><img id="profileAvatar" class="profile-avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"><input type="file" id="avatarFile" accept="image/*" style="display:none"><button class="btn-secondary" id="removeAvatarBtn" style="margin-top:12px; padding:8px 16px;">🗑️ Remove Avatar</button></div><div class="form-group" style="margin-top:20px;"><label>Display Name</label><input type="text" id="profileName" placeholder="Your name"></div><div class="form-group"><label>New Password (leave empty to keep)</label><input type="password" id="profileNewPassword" placeholder="New password"></div><div class="modal-buttons"><button class="btn btn-primary" id="updateProfileBtn">💾 Save Changes</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="editMessageModal"><div class="modal-content"><h3>✏️ Edit Message</h3><textarea id="editMessageText" rows="3" style="width:100%; background:#1f1f1f; border:1px solid #2a2a2a; border-radius:14px; padding:14px; color:white; font-family:inherit; resize:none;"></textarea><div class="modal-buttons"><button class="btn btn-primary" id="saveEditMessage">💾 Save</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
