<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Wolf Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

            .logo img {
                width: 100px;
                height: 100px;
                object-fit: contain;
                filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.5));
            }

            .logo h1 {
                font-size: 28px;
                margin-top: 16px;
                background: linear-gradient(135deg, #ef4444, #dc2626);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .logo p {
                color: #6b7280;
                font-size: 14px;
                margin-top: 4px;
            }

        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.2s;
            border-radius: 8px;
        }

            .auth-tab.active {
                color: #ef4444;
                background: rgba(239, 68, 68, 0.1);
            }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .form-group label {
                font-size: 14px;
                font-weight: 500;
                color: #9ca3af;
            }

            .form-group input, .form-group textarea {
                background: #1a1a1a;
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                padding: 12px 16px;
                color: #e0e0e0;
                font-size: 14px;
                transition: all 0.2s;
            }

                .form-group input:focus, .form-group textarea:focus {
                    outline: none;
                    border-color: #dc2626;
                    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
                }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 10px 20px -5px rgba(220, 38, 38, 0.4);
            }

        .btn-secondary {
            background: #2a2a2a;
            color: #e0e0e0;
        }

            .btn-secondary:hover {
                background: #3a3a3a;
            }

        .btn-danger {
            background: #7f1d1d;
            color: white;
        }

            .btn-danger:hover {
                background: #991b1b;
            }

        .error-message {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: #ef4444;
            font-size: 14px;
            text-align: center;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: #22c55e;
            font-size: 14px;
            text-align: center;
        }

        .app-container {
            display: none;
            height: 100vh;
            overflow: hidden;
        }

            .app-container.active {
                display: flex;
            }

        .sidebar {
            width: 320px;
            background: #0f0f0f;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
        }

        .sidebar-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #dc2626;
            background: #2a2a2a;
        }

        .sidebar-header h3 {
            flex: 1;
            font-size: 16px;
            cursor: pointer;
        }

            .sidebar-header h3:hover {
                color: #ef4444;
            }

        .logout-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 20px;
            transition: color 0.2s;
        }

            .logout-btn:hover {
                color: #ef4444;
            }

        .btn-new-chat {
            margin: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

            .btn-new-chat:hover {
                transform: translateY(-1px);
                box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
            }

        .btn-create-group {
            margin: 0 12px 12px 12px;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #dc2626;
            border-radius: 12px;
            color: #e0e0e0;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

            .btn-create-group:hover {
                background: #dc2626;
                color: white;
            }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-item {
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            background: #141414;
            border: 1px solid #202020;
        }

            .chat-item:hover {
                background: #1a1a1a;
                border-color: #dc2626;
            }

            .chat-item.active {
                background: linear-gradient(135deg, #1a0a0a, #141414);
                border-color: #dc2626;
            }

        .chat-avatar-container {
            position: relative;
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #141414;
        }

            .online-dot.online {
                background: #22c55e;
            }

            .online-dot.offline {
                background: #6b7280;
            }

        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-preview {
            font-size: 12px;
            color: #6b7280;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-badge {
            font-size: 10px;
            background: #dc2626;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #121212;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            background: #0f0f0f;
        }

        .chat-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #ef4444;
        }

        .chat-header-status {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

            .chat-header-status.online {
                color: #22c55e;
            }

        .edit-chat-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            color: #e0e0e0;
            transition: all 0.2s;
        }

            .edit-chat-btn:hover {
                background: #dc2626;
                color: white;
            }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            position: relative;
        }

            .message.own {
                align-self: flex-end;
            }

            .message.system {
                align-self: center;
                max-width: 90%;
                font-style: italic;
                color: #6b7280;
                font-size: 12px;
            }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

            .message-header img {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                object-fit: cover;
                cursor: pointer;
                transition: opacity 0.2s;
                background: #2a2a2a;
            }

                .message-header img:hover {
                    opacity: 0.8;
                }

        .message-sender {
            font-size: 12px;
            font-weight: 500;
            color: #9ca3af;
            cursor: pointer;
        }

            .message-sender:hover {
                color: #ef4444;
                text-decoration: underline;
            }

        .message-content {
            padding: 10px 14px;
            border-radius: 18px;
            background: #1a1a1a;
            word-wrap: break-word;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }

        .message.system .message-content {
            background: #1a1a1a;
            color: #6b7280;
            font-style: italic;
        }

        .message-time {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
            margin-left: 4px;
        }

        .message-actions {
            position: absolute;
            right: -40px;
            top: 0;
            display: none;
            gap: 8px;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-actions button {
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

            .message-actions button:hover {
                background: #dc2626;
                color: white;
            }

        .message-file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #1a1a1a;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

            .message-file:hover {
                background: #2a2a2a;
            }

        .file-icon {
            font-size: 28px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            font-size: 14px;
        }

        .file-size {
            font-size: 11px;
            color: #6b7280;
        }

        .message-caption {
            margin-top: 6px;
            font-size: 13px;
            opacity: 0.8;
        }

        .message-input-area {
            padding: 20px;
            border-top: 1px solid #2a2a2a;
            background: #0f0f0f;
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }

            .message-input-area input[type="text"] {
                flex: 1;
                background: #1a1a1a;
                border: 1px solid #2a2a2a;
                border-radius: 24px;
                padding: 12px 20px;
                color: #e0e0e0;
                font-size: 14px;
            }

                .message-input-area input[type="text"]:focus {
                    outline: none;
                    border-color: #dc2626;
                }

        .attach-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }

            .attach-btn:hover {
                background: #dc2626;
            }

        .emoji-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }

            .emoji-btn:hover {
                background: #dc2626;
            }

        .send-btn {
            background: #dc2626;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            transition: all 0.2s;
        }

            .send-btn:hover {
                background: #b91c1c;
                transform: scale(1.05);
            }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 40px;
        }

        .typing-indicator {
            font-size: 12px;
            color: #6b7280;
            padding: 8px 20px;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            .modal.active {
                display: flex;
            }

        .modal-content {
            background: #141414;
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(220, 38, 38, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

            .modal-content h3 {
                margin-bottom: 20px;
                color: #ef4444;
            }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .user-search-result {
            padding: 12px;
            border-radius: 12px;
            background: #1a1a1a;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .user-search-result:hover {
                background: #2a2a2a;
                border-left: 3px solid #dc2626;
            }

            .user-search-result img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                object-fit: cover;
                background: #2a2a2a;
            }

        .selected-members {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .member-tag {
            background: #dc2626;
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .member-tag button {
                background: none;
                border: none;
                color: white;
                cursor: pointer;
                font-size: 14px;
            }

        .profile-avatar {
            text-align: center;
            margin-bottom: 24px;
        }

        .profile-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .profile-avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #dc2626;
            cursor: pointer;
            background: #2a2a2a;
        }

        .member-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .member-info img {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                object-fit: cover;
                background: #2a2a2a;
            }

        .remove-member-btn {
            background: #7f1d1d;
            border: none;
            border-radius: 8px;
            padding: 4px 8px;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }

            .remove-member-btn:hover {
                background: #991b1b;
            }

        .code-input {
            letter-spacing: 4px;
            font-size: 24px;
            text-align: center;
        }

        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .user-profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #dc2626;
            background: #2a2a2a;
        }

        .user-profile-info h4 {
            font-size: 20px;
            color: #ef4444;
        }

        .user-profile-info p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        emoji-picker {
            --background: #1a1a1a;
            --border-radius: 16px;
            --category-emoji-size: 24px;
            --category-padding: 12px;
            --category-button-color: #ef4444;
            --input-border-radius: 12px;
            --input-border-color: #2a2a2a;
            --input-color: #e0e0e0;
            --num-columns: 8;
            --emoji-size: 28px;
            position: absolute;
            bottom: 70px;
            left: 0;
            z-index: 1000;
            width: 350px;
            max-height: 400px;
            display: none;
        }

        .emoji-picker-container {
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo">
                <img src="/logo.png" alt="Red Wolf" onerror="this.style.display='none'">
                <h1>Red Wolf</h1>
                <p>Secure Messenger</p>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <div id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Login (Phone or Name)</label>
                    <input type="text" id="loginLogin" placeholder="Enter your login">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">Login →</button>
                <div id="loginError" class="error-message" style="display: none;"></div>
            </div>

            <div id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="+79991234567">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="regName" placeholder="Your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Min 6 characters">
                </div>
                <button class="btn btn-primary" onclick="requestVerificationCode()">Send Code →</button>
                <div id="registerError" class="error-message" style="display: none;"></div>
            </div>

            <div id="verifyForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="verifyCode" class="code-input" placeholder="Enter 6-digit code" maxlength="6">
                </div>
                <button class="btn btn-primary" onclick="verifyAndRegister()">Verify & Register →</button>
                <button class="btn btn-secondary" onclick="backToRegister()">← Back</button>
                <div id="verifyError" class="error-message" style="display: none;"></div>
                <div id="verifySuccess" class="success-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <div class="sidebar-header">
                <img class="sidebar-logo" src="/logo.png" alt="Logo" onerror="this.style.display='none'">
                <img id="sidebarAvatar" class="sidebar-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Avatar" onclick="showProfileModal()">
                <h3 id="currentUserName" onclick="showProfileModal()">Loading...</h3>
                <button class="logout-btn" onclick="logout()">🚪</button>
            </div>

            <button class="btn-new-chat" onclick="showNewChatModal()">+ New Chat</button>
            <button class="btn-create-group" onclick="showCreateGroupModal()">👥 Create Group</button>

            <div class="chats-list" id="chatsList">
                <div class="empty-state">Loading chats...</div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h2>Select a chat</h2>
                <p>Choose conversation to start messaging</p>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">No messages yet</div>
            </div>
            <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
            <div class="message-input-area">
                <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <div class="emoji-picker-container">
                    <button class="emoji-btn" id="emojiBtn">😊</button>
                </div>
                <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.17.0/index.js';

        window.initEmojiPicker = () => {
            const container = document.querySelector('.emoji-picker-container');
            if (!container) return;

            const picker = document.createElement('emoji-picker');
            picker.id = 'emojiPicker';

            picker.addEventListener('emoji-click', (event) => {
                const input = document.getElementById('messageInput');
                if (input) {
                    input.value += event.detail.unicode;
                    picker.style.display = 'none';
                    input.focus();
                }
            });

            container.appendChild(picker);

            const emojiBtn = document.getElementById('emojiBtn');
            if (emojiBtn) {
                emojiBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (picker) {
                        picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
                    }
                });
            }

            document.addEventListener('click', (e) => {
                if (container && !container.contains(e.target) && picker && picker.style.display === 'block') {
                    picker.style.display = 'none';
                }
            });
        };
    </script>
    <script>
        let currentUser = null;
        let currentChat = null;
        let currentChatInfo = null;
        let token = null;
        let connection = null;
        let typingTimeout = null;
        let editingMessageId = null;
        let selectedGroupMembers = [];
        let tempPhoneNumber = null;
        let onlineUsers = new Map();

        const API_BASE = '/api';

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('loginForm').style.display = 'flex';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('verifyForm').style.display = 'none';
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'flex';
                document.getElementById('verifyForm').style.display = 'none';
            }
        }

        async function requestVerificationCode() {
            const phone = document.getElementById('regPhone').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value;
            if (!phone || !name || !password) {
                alert('Please fill all fields');
                return;
            }
            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/User/request-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, name, password })
                });
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }
                const data = await response.json();
                tempPhoneNumber = data.phoneNumber;
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('verifyForm').style.display = 'flex';
                document.getElementById('verifyCode').value = data.code || '';
                alert(`Code sent to ${phone}`);
            } catch (error) {
                alert('Failed to send code: ' + error.message);
            }
        }

        async function verifyAndRegister() {
            const code = document.getElementById('verifyCode').value.trim();
            if (!code || code.length !== 6) {
                alert('Please enter 6-digit code');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/User/verify-and-register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: tempPhoneNumber, code: code })
                });
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }
                const data = await response.json();
                token = data.token;
                currentUser = { id: data.userId };
                localStorage.setItem('token', token);
                localStorage.setItem('userId', data.userId);
                await initApp();
            } catch (error) {
                alert('Verification failed: ' + error.message);
            }
        }

        function backToRegister() {
            document.getElementById('verifyForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'flex';
        }

        async function handleLogin() {
            const login = document.getElementById('loginLogin').value;
            const password = document.getElementById('loginPassword').value;
            if (!login || !password) {
                alert('Please fill all fields');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/User/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }
                const data = await response.json();
                token = data.token;
                currentUser = { id: data.userId };
                localStorage.setItem('token', token);
                localStorage.setItem('userId', data.userId);
                await initApp();
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }

        async function initApp() {
            if (!token) {
                token = localStorage.getItem('token');
                const userId = localStorage.getItem('userId');
                if (token && userId) currentUser = { id: userId };
                else return;
            }
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            await loadUserProfile();
            await loadChats();
            await initSignalR();
            if (typeof window.initEmojiPicker === 'function') {
                window.initEmojiPicker();
            }
        }

        async function loadUserProfile() {
            try {
                const response = await fetch(`${API_BASE}/User/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    currentUser = { ...currentUser, ...user };
                    document.getElementById('currentUserName').textContent = user.name;
                    if (user.avatarPath && user.avatarPath !== '/avatars/default-avatar.png') {
                        const avatarUrl = `${API_BASE}/User/avatar/${currentUser.id}?t=${Date.now()}`;
                        document.getElementById('sidebarAvatar').src = avatarUrl;
                        document.getElementById('profileAvatar').src = avatarUrl;
                    }
                }
            } catch (error) {
                console.error('Failed to load profile:', error);
            }
        }

        async function loadChats() {
            try {
                const response = await fetch(`${API_BASE}/Chat/user-chats/${currentUser.id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const chats = await response.json();
                    renderChats(chats);
                }
            } catch (error) {
                console.error('Failed to load chats:', error);
            }
        }

        function renderChats(chats) {
            const container = document.getElementById('chatsList');
            if (!chats || chats.length === 0) {
                container.innerHTML = '<div class="empty-state">No chats yet. Click +New Chat to start!</div>';
                return;
            }
            container.innerHTML = chats.map(chat => {
                const isGroup = chat.maxUsers > 2 || (chat.users && chat.users.length > 2);
                const otherUser = chat.otherUser;
                const avatarUrl = otherUser?.id ? `${API_BASE}/User/avatar/${otherUser.id}` : null;
                const preview = isGroup ? `${chat.users?.length || 0} members` : (chat.otherUser?.name || chat.chatName);
                const isOnline = otherUser?.id ? onlineUsers.get(otherUser.id) === true : false;
                return `
                        <div class="chat-item" data-user-id="${otherUser?.id || ''}" onclick="selectChat('${chat.id}', '${escapeHtml(chat.chatName)}')">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="chat-avatar-container">
                                    <img src="${avatarUrl || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'}" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #2a2a2a;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'">
                                    ${!isGroup ? `<div class="online-dot ${isOnline ? 'online' : 'offline'}"></div>` : ''}
                                </div>
                                <div>
                                    <div class="chat-name">
                                        ${escapeHtml(chat.chatName)}
                                        ${isGroup ? '<span class="chat-badge">GROUP</span>' : ''}
                                    </div>
                                    <div class="chat-preview">${escapeHtml(preview)}</div>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        async function getChatInfo(chatId) {
            try {
                const response = await fetch(`${API_BASE}/Chat/${chatId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) return await response.json();
            } catch (error) {
                console.error('Failed to get chat info:', error);
            }
            return null;
        }

        async function selectChat(chatId, chatName) {
            currentChat = { id: chatId, name: chatName };
            currentChatInfo = await getChatInfo(chatId);
            const isGroup = currentChatInfo && (currentChatInfo.maxUsers > 2 || (currentChatInfo.users && currentChatInfo.users.length > 2));
            const otherUserId = !isGroup && currentChatInfo?.otherUser?.id;
            let statusText = '';
            if (!isGroup && otherUserId) {
                const isOnline = onlineUsers.get(otherUserId) === true;
                statusText = isOnline ? '🟢 Online' : '⚫ Offline';
            }
            document.getElementById('chatHeader').innerHTML = `
                    <div class="chat-header-top">
                        <div class="chat-header-info">
                            <img class="chat-header-logo" src="/logo.png" alt="Logo" onerror="this.style.display='none'">
                            <div>
                                <h2>${escapeHtml(chatName)}</h2>
                                ${!isGroup ? `<div class="chat-header-status ${statusText === '🟢 Online' ? 'online' : ''}">${statusText}</div>` : `<p>${currentChatInfo?.users?.length || 0} members</p>`}
                            </div>
                        </div>
                        <button class="edit-chat-btn" onclick="showEditChatModal()">✏️ Edit</button>
                    </div>
                `;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            await loadMessages(chatId);
            if (connection) {
                await connection.invoke('JoinChat', chatId, currentUser.id, currentUser.name);
            }
        }

        async function loadMessages(chatId) {
            try {
                const response = await fetch(`${API_BASE}/Chat/${chatId}/messages?page=1&pageSize=100`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderMessages(data.messages);
                }
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return '🖼️';
            if (['mp4', 'mov', 'avi', 'mkv'].includes(ext)) return '🎥';
            if (['pdf'].includes(ext)) return '📕';
            if (['doc', 'docx'].includes(ext)) return '📘';
            if (['xls', 'xlsx'].includes(ext)) return '📊';
            if (['ppt', 'pptx'].includes(ext)) return '📙';
            if (['txt'].includes(ext)) return '📄';
            return '📎';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function showUserProfile(userId) {
            try {
                const response = await fetch(`${API_BASE}/Chat/user-profile/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    const avatarUrl = `${API_BASE}/User/avatar/${userId}?t=${Date.now()}`;
                    const registerDate = new Date(user.registerDate).toLocaleDateString('ru-RU');
                    document.getElementById('userProfileContent').innerHTML = `
                            <div class="user-profile-header">
                                <img class="user-profile-avatar" src="${avatarUrl}" alt="Avatar" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'">
                                <div class="user-profile-info">
                                    <h4>${escapeHtml(user.name)}</h4>
                                    <p>📅 Joined ${registerDate}</p>
                                    <p>🆔 ${user.id}</p>
                                </div>
                            </div>
                        `;
                    document.getElementById('userProfileModal').classList.add('active');
                } else {
                    alert('User profile not available');
                }
            } catch (error) {
                console.error('Failed to load user profile:', error);
                alert('Failed to load user profile');
            }
        }

        function closeUserProfileModal() {
            document.getElementById('userProfileModal').classList.remove('active');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.createElement('div');
                toast.textContent = 'Copied!';
                toast.style.position = 'fixed';
                toast.style.bottom = '20px';
                toast.style.right = '20px';
                toast.style.background = '#22c55e';
                toast.style.color = 'white';
                toast.style.padding = '8px 16px';
                toast.style.borderRadius = '8px';
                toast.style.zIndex = '9999';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state">No messages yet. Send the first message!</div>';
                return;
            }

            const sortedMessages = [...messages].sort((a, b) =>
                new Date(a.messageCreateDate) - new Date(b.messageCreateDate)
            );

            const messagesHtml = sortedMessages.map(msg => {
                if (msg.fileName) {
                    const isOwn = msg.userId === currentUser.id;
                    const avatarUrl = msg.user?.id ? `${API_BASE}/User/avatar/${msg.userId}` : null;
                    const icon = getFileIcon(msg.fileName);
                    return `
                            <div class="message ${isOwn ? 'own' : ''}" data-message-id="${msg.messageId}">
                                <div class="message-header">
                                    <img src="${avatarUrl || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'}" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; cursor: pointer; background: #2a2a2a;" onclick="showUserProfile('${msg.userId}')" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'">
                                    <span class="message-sender" onclick="showUserProfile('${msg.userId}')">${escapeHtml(msg.user?.name || 'Unknown')}</span>
                                </div>
                                <div class="message-file" onclick="downloadFile('${msg.messageId}', '${escapeHtml(msg.fileName)}')">
                                    <div class="file-icon">${icon}</div>
                                    <div class="file-info">
                                        <div class="file-name">${escapeHtml(msg.fileName)}</div>
                                        <div class="file-size">${formatFileSize(msg.fileSize)}</div>
                                    </div>
                                </div>
                                ${msg.caption ? `<div class="message-caption">${escapeHtml(msg.caption)}</div>` : ''}
                                <div class="message-time">${new Date(msg.messageCreateDate).toLocaleTimeString()}</div>
                                ${isOwn ? `<div class="message-actions"><button onclick="deleteFileMessage('${msg.messageId}')">🗑️ Delete</button></div>` : ''}
                            </div>
                        `;
                }
                const isSystem = msg.isSystemMessage;
                const avatarUrl = msg.messageCreator?.id && !isSystem ? `${API_BASE}/User/avatar/${msg.userId}` : null;
                const isOwn = msg.userId === currentUser.id;
                const edited = msg.messageCreateDate !== msg.messageLastUpdateDate;
                if (isSystem) {
                    return `<div class="message system"><div class="message-content">📢 ${escapeHtml(msg.messageText)}</div><div class="message-time">${new Date(msg.messageCreateDate).toLocaleTimeString()}</div></div>`;
                }
                return `

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChat || !currentUser) return;
            try {
                const response = await fetch(`${API_BASE}/Message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ messageText: text, userId: currentUser.id, chatId: currentChat.id })
                });
                if (response.ok) {
                    input.value = '';
                    await loadMessages(currentChat.id);
                    if (connection) {
                        await connection.invoke('SendMessage', currentChat.id, currentUser.id, currentUser.name, text);
                    }
                } else {
                    const error = await response.text();
                    alert('Failed to send message: ' + error);
                }
            } catch (error) {
                console.error('Failed to send message:', error);
                alert('Failed to send message');
            }
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            const file = input.files[0];
            if (!file || !currentChat) return;
            if (file.size > 50 * 1024 * 1024) {
                alert('File too large! Max 50MB');
                input.value = '';
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            formData.append('chatId', currentChat.id);
            try {
                const response = await fetch(`${API_BASE}/File/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (response.ok) {
                    input.value = '';
                    await loadMessages(currentChat.id);
                    if (connection) {
                        await connection.invoke('SendMessage', currentChat.id, currentUser.id, currentUser.name, `📎 ${file.name}`);
                    }
                } else {
                    const error = await response.text();
                    alert('Failed to upload file: ' + error);
                }
            } catch (error) {
                console.error('Failed to upload file:', error);
                alert('Failed to upload file');
            }
        }

        async function downloadFile(messageId, fileName) {
            try {
                const response = await fetch(`${API_BASE}/File/download/${messageId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                } else {
                    alert('Failed to download file');
                }
            } catch (error) {
                console.error('Failed to download file:', error);
                alert('Failed to download file');
            }
        }

        }

        function closeEditMessageModal() {
            document.getElementById('editMessageModal').classList.remove('active');
            editingMessageId = null;
        }

        async function showProfileModal() {
            try {
                const response = await fetch(`${API_BASE}/User/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('profileName').value = user.name;
                    if (user.avatarPath && user.avatarPath !== '/avatars/default-avatar.png') {
                        document.getElementById('profileAvatar').src = `${API_BASE}/User/avatar/${user.id}?t=${Date.now()}`;
                    }
                    document.getElementById('profileNewPassword').value = '';
                    document.getElementById('profileModal').classList.add('active');
                }
            } catch (error) {
                console.error('Failed to load profile:', error);
                alert('Failed to load profile');
            }
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        async function updateProfile() {
            const newName = document.getElementById('profileName').value.trim();
            const newPassword = document.getElementById('profileNewPassword').value;
            const updateData = {};
            if (newName) updateData.name = newName;
            if (newPassword) updateData.newPassword = newPassword;
            if (Object.keys(updateData).length === 0) {
                closeProfileModal();
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/User/update-profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(updateData)
                });
                if (response.ok) {
                    const user = await response.json();
                    currentUser.name = user.name;
                    document.getElementById('currentUserName').textContent = user.name;
                    alert('Profile updated successfully!');
                    closeProfileModal();
                } else {
                    const error = await response.text();
                    alert('Failed to update profile: ' + error);
                }
            } catch (error) {
                console.error('Failed to update profile:', error);
                alert('Failed to update profile');
            }
        }

        async function uploadAvatarFromProfile(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert('File too large! Max 5MB');
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch(`${API_BASE}/User/upload-avatar`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (response.ok) {
                    const data = await response.json();
                    const avatarUrl = `${API_BASE}/User/avatar/${currentUser.id}?t=${Date.now()}`;
                    document.getElementById('sidebarAvatar').src = avatarUrl;
                    document.getElementById('profileAvatar').src = avatarUrl;
                    await loadChats();
                    alert('Avatar updated!');
                } else {
                    const error = await response.text();
                    alert('Failed to upload avatar: ' + error);
                }
            } catch (error) {
                console.error('Failed to upload avatar:', error);
                alert('Failed to upload avatar');
            }
        }

        async function deleteAvatar() {
            if (!confirm('Remove your avatar? It will be replaced with default.')) return;
            try {
                const response = await fetch(`${API_BASE}/User/avatar`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    document.getElementById('sidebarAvatar').src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E';
                    document.getElementById('profileAvatar').src = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%236b7280\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E';
                    await loadChats();
                    alert('Avatar removed!');
                } else {
                    const error = await response.text();
                    alert('Failed to remove avatar: ' + error);
                }
            } catch (error) {
                console.error('Failed to delete avatar:', error);
                alert('Failed to delete avatar');
            }
        }

        async function initSignalR() {
            connection = new signalR.HubConnectionBuilder()
                .withUrl("/messengerHub", { accessTokenFactory: () => token })
                .withAutomaticReconnect()
                .build();
            connection.on("ReceiveMessage", () => {
                if (currentChat) loadMessages(currentChat.id);
            });
            connection.on("UserOnline", (userId, isOnline) => {
                onlineUsers.set(userId, isOnline);
                const chatItem = document.querySelector(`.chat-item[data-user-id="${userId}"]`);
                if (chatItem) {
                    const dot = chatItem.querySelector('.online-dot');
                    if (dot) dot.className = `online-dot ${isOnline ? 'online' : 'offline'}`;
                }
                if (currentChatInfo && currentChatInfo.otherUser?.id === userId) {
                    const statusDiv = document.querySelector('.chat-header-status');
                    if (statusDiv) {
                        if (isOnline) {
                            statusDiv.textContent = '🟢 Online';
                            statusDiv.classList.add('online');
                        } else {
                            statusDiv.textContent = '⚫ Offline';
                            statusDiv.classList.remove('online');
                        }
                    }
                }
            });
            connection.on("UserTyping", (userId, userName) => {
                if (currentChat && userId !== currentUser.id) {
                    const typingDiv = document.getElementById('typingIndicator');
                    typingDiv.textContent = `${userName} is typing...`;
                    typingDiv.style.display = 'block';
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => typingDiv.style.display = 'none', 2000);
                }
            });
            connection.on("UserStoppedTyping", (userId) => {
                if (userId !== currentUser.id) document.getElementById('typingIndicator').style.display = 'none';
            });
            try {
                await connection.start();
                console.log("SignalR connected");
                if (currentChat) await connection.invoke('JoinChat', currentChat.id, currentUser.id, currentUser.name);
            } catch (error) {
                console.error("SignalR connection failed:", error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            token = null;
            currentUser = null;
            currentChat = null;
            currentChatInfo = null;
            onlineUsers.clear();
            if (connection) connection.stop();
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('loginLogin').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function startTyping() {
            if (connection && currentChat && document.getElementById('messageInput').value.length > 0) {
                connection.invoke('UserIsTyping', currentChat.id, currentUser.id, currentUser.name);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => connection.invoke('UserStoppedTyping', currentChat.id, currentUser.id), 1000);
            }
        }

        document.getElementById('messageInput')?.addEventListener('input', startTyping);
        document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        if (localStorage.getItem('token')) {
            token = localStorage.getItem('token');
            const userId = localStorage.getItem('userId');
            if (userId) {
                currentUser = { id: userId };
                initApp();
            }
        }
    </script>
