<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Wolf Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #e0e0e0;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        .auth-card {
            background: #141414;
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a2a2a;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

            .logo h1 {
                font-size: 32px;
                background: linear-gradient(135deg, #ef4444, #dc2626);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .logo p {
                color: #6b7280;
                font-size: 14px;
                margin-top: 4px;
            }

        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 12px;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #6b7280;
            border-radius: 12px;
        }

            .auth-tab.active {
                color: #ef4444;
                background: rgba(239, 68, 68, 0.1);
            }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            .form-group label {
                font-size: 14px;
                font-weight: 500;
                color: #9ca3af;
            }

            .form-group input, .form-group textarea {
                background: #1f1f1f;
                border: 1px solid #2a2a2a;
                border-radius: 14px;
                padding: 12px 16px;
                color: #e0e0e0;
                font-size: 14px;
            }

                .form-group input:focus, .form-group textarea:focus {
                    outline: none;
                    border-color: #dc2626;
                }

        .btn {
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #dc2626;
            color: white;
        }

            .btn-primary:hover {
                background: #b91c1c;
            }

        .btn-secondary {
            background: #2a2a2a;
            color: #e0e0e0;
        }

            .btn-secondary:hover {
                background: #3a3a3a;
            }

        .btn-danger {
            background: #7f1d1d;
            color: white;
        }

            .btn-danger:hover {
                background: #991b1b;
            }

        .error-message {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 12px;
            padding: 12px;
            color: #ef4444;
            font-size: 14px;
            text-align: center;
        }

        .app-container {
            display: none;
            height: 100vh;
            overflow: hidden;
        }

            .app-container.active {
                display: flex;
            }

        .menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: #dc2626;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .sidebar {
            width: 320px;
            background: #0f0f0f;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            transition: left 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #dc2626;
        }

        .sidebar-header h3 {
            flex: 1;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 22px;
        }

        .btn-new-chat, .btn-create-group {
            margin: 12px;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-new-chat {
            background: #dc2626;
            border: none;
            color: white;
        }

        .btn-create-group {
            background: #1f1f1f;
            border: 1px solid #dc2626;
            color: #e0e0e0;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-item {
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            background: #141414;
            border: 1px solid #252525;
        }

            .chat-item:hover {
                background: #1a1a1a;
                border-color: #dc2626;
            }

        .chat-avatar-container {
            position: relative;
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #141414;
        }

            .online-dot.online {
                background: #22c55e;
            }

            .online-dot.offline {
                background: #6b7280;
            }

        .chat-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-badge {
            font-size: 10px;
            background: #dc2626;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .chat-preview {
            font-size: 12px;
            color: #6b7280;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #121212;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            background: #0f0f0f;
        }

        .chat-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #ef4444;
        }

        .edit-chat-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            color: #e0e0e0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            margin-bottom: 8px;
        }

            .message.own {
                align-self: flex-end;
            }

            .message.system {
                align-self: center;
                max-width: 90%;
            }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

            .message-header img {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                cursor: pointer;
            }

        .message-sender {
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
        }

        .message-content {
            padding: 10px 14px;
            border-radius: 18px;
            background: #1f1f1f;
            word-wrap: break-word;
        }

        .message.own .message-content {
            background: #dc2626;
            color: white;
        }

        .message-time {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
            margin-left: 4px;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

            .message-actions button {
                background: #2a2a2a;
                border: none;
                border-radius: 8px;
                padding: 5px 10px;
                cursor: pointer;
                font-size: 11px;
                color: #e0e0e0;
            }

                .message-actions button:hover {
                    background: #dc2626;
                    color: white;
                }

        .message-file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #1f1f1f;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            word-break: break-all;
        }

        .file-size {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        .download-btn {
            background: #22c55e !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 8px 16px !important;
            color: white !important;
            cursor: pointer !important;
            font-weight: bold !important;
            font-size: 13px !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
        }

            .download-btn:hover {
                background: #16a34a !important;
                transform: scale(1.02) !important;
            }

        .message-caption {
            margin-top: 6px;
            font-size: 12px;
            opacity: 0.8;
            padding: 4px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .message-input-area {
            padding: 16px 20px;
            border-top: 1px solid #2a2a2a;
            background: #0f0f0f;
            display: flex;
            gap: 10px;
            align-items: center;
        }

            .message-input-area input {
                flex: 1;
                background: #1f1f1f;
                border: 1px solid #2a2a2a;
                border-radius: 24px;
                padding: 12px 18px;
                color: #e0e0e0;
                font-size: 14px;
            }

                .message-input-area input:focus {
                    outline: none;
                    border-color: #dc2626;
                }

        .attach-btn, .emoji-btn, .send-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 18px;
        }

        .send-btn {
            background: #dc2626;
            color: white;
        }

            .attach-btn:hover, .emoji-btn:hover, .send-btn:hover {
                opacity: 0.8;
            }

        .typing-indicator {
            font-size: 12px;
            color: #6b7280;
            padding: 6px 20px;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

            .modal.active {
                display: flex;
            }

        .modal-content {
            background: #141414;
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 480px;
            border: 1px solid #2a2a2a;
            max-height: 85vh;
            overflow-y: auto;
        }

            .modal-content h3 {
                color: #ef4444;
                margin-bottom: 20px;
            }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .user-search-result {
            padding: 10px;
            border-radius: 12px;
            background: #1f1f1f;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .user-search-result:hover {
                background: #2a2a2a;
                border-left: 3px solid #dc2626;
            }

            .user-search-result img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
            }

        .selected-members {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .member-tag {
            background: #dc2626;
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .member-tag button {
                background: none;
                border: none;
                color: white;
                cursor: pointer;
            }

        .profile-avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #dc2626;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }

            .sidebar {
                position: fixed;
                left: -300px;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 1000;
            }

                .sidebar.open {
                    left: 0;
                }

            .message {
                max-width: 85%;
            }

            .chat-header {
                padding-left: 60px;
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 9999;
            font-size: 14px;
            animation: fadeOut 2.5s forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>

    <!-- AUTH -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo">
                <h1>🐺 Red Wolf</h1>
                <p>Secure Messenger</p>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <div id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Login (Phone or Name)</label>
                    <input type="text" id="loginLogin" placeholder="Enter your login">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" id="doLoginBtn">Login →</button>
                <div id="loginError" class="error-message" style="display:none"></div>
            </div>

            <div id="registerForm" class="auth-form" style="display:none">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="+79991234567">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="regName" placeholder="Username">
                </div>
                <div class="form-group">
                    <label>Password (min 6)</label>
                    <input type="password" id="regPassword" placeholder="Password">
                </div>
                <button class="btn btn-primary" id="sendCodeBtn">Send Code →</button>
            </div>

            <div id="verifyForm" class="auth-form" style="display:none">
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="verifyCode" placeholder="6-digit code" maxlength="6">
                </div>
                <button class="btn btn-primary" id="verifyBtn">Verify & Register →</button>
                <button class="btn btn-secondary" id="backToRegisterBtn">← Back</button>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div class="app-container" id="appContainer">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img id="sidebarAvatar" class="sidebar-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
                <h3 id="currentUserName">Loading...</h3>
                <button class="logout-btn" id="logoutBtn">🚪</button>
            </div>
            <button class="btn-new-chat" id="newChatBtn">+ New Chat</button>
            <button class="btn-create-group" id="createGroupBtn">👥 Create Group</button>
            <div class="chats-list" id="chatsList"><div class="empty-state">Loading chats...</div></div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader"><h2>Select a chat</h2></div>
            <div class="messages-container" id="messagesContainer"><div class="empty-state">No messages</div></div>
            <div class="typing-indicator" id="typingIndicator" style="display:none"></div>
            <div class="message-input-area">
                <input type="file" id="fileInput" style="display:none">
                <button class="attach-btn" id="attachBtn">📎</button>
                <button class="emoji-btn" id="emojiBtn">😊</button>
                <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                <button class="send-btn" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal" id="userProfileModal"><div class="modal-content"><div id="userProfileContent"></div><div class="modal-buttons"><button class="btn btn-secondary close-modal">Close</button></div></div></div>
    <div class="modal" id="newChatModal"><div class="modal-content"><h3>New Private Chat</h3><input type="text" id="searchUserInput" placeholder="Search username..."><div id="searchResults"></div><div class="modal-buttons"><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="createGroupModal"><div class="modal-content"><h3>Create Group</h3><input type="text" id="groupName" placeholder="Group name"><input type="number" id="groupMaxUsers" value="100"><input type="text" id="groupSearchInput" placeholder="Search members..."><div id="groupSearchResults"></div><div id="selectedMembers"></div><div class="modal-buttons"><button class="btn btn-primary" id="createGroupSubmit">Create</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="editChatModal"><div class="modal-content"><h3 id="editChatTitle">Edit Chat</h3><input type="text" id="editChatName" placeholder="Chat name"><div id="groupMembersSection" style="display:none"><input type="text" id="addMemberSearch" placeholder="Add member..."><div id="addMemberResults"></div><div id="membersList"></div></div><div class="modal-buttons"><button class="btn btn-primary" id="saveChatEdit">Save</button><button class="btn btn-danger" id="leaveDeleteBtn">Leave</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="profileModal"><div class="modal-content"><h3>My Profile</h3><div style="text-align:center"><img id="profileAvatar" class="profile-avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"><input type="file" id="avatarFile" accept="image/*" style="display:none"><button class="btn-secondary" id="removeAvatarBtn" style="margin-top:8px">Remove Avatar</button></div><div class="form-group"><label>Name</label><input type="text" id="profileName"></div><div class="form-group"><label>New Password</label><input type="password" id="profileNewPassword"></div><div class="modal-buttons"><button class="btn btn-primary" id="updateProfileBtn">Save</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>
    <div class="modal" id="editMessageModal"><div class="modal-content"><h3>Edit Message</h3><textarea id="editMessageText" rows="3" style="width:100%;background:#1f1f1f;border:none;border-radius:12px;padding:12px;color:white"></textarea><div class="modal-buttons"><button class="btn btn-primary" id="saveEditMessage">Save</button><button class="btn btn-secondary close-modal">Cancel</button></div></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.17.0/index.js';
        const initEmojiPicker = () => {
            const container = document.querySelector('.emoji-picker-container');
            if (!container) return;
            const picker = document.createElement('emoji-picker');
            picker.addEventListener('emoji-click', (event) => {
                const input = document.getElementById('messageInput');
                if (input) { input.value += event.detail.unicode; picker.style.display = 'none'; input.focus(); }
            });
            container.appendChild(picker);
            const emojiBtn = document.getElementById('emojiBtn');
            if (emojiBtn) emojiBtn.addEventListener('click', (e) => { e.stopPropagation(); picker.style.display = picker.style.display === 'none' ? 'block' : 'none'; });
            document.addEventListener('click', (e) => { if (container && !container.contains(e.target) && picker.style.display === 'block') picker.style.display = 'none'; });
        };
        window.initEmojiPicker = initEmojiPicker;
    </script>
    <script>
        // STATE
        let currentUser = null, currentChat = null, currentChatInfo = null, token = null, connection = null;
        let typingTimeout = null, editingMessageId = null;
        let selectedGroupMembers = [], tempPhoneNumber = null;
        let onlineUsers = new Map();
        const API_BASE = '/api';
        const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

        // UTILS
        function showToast(msg, isErr = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.background = isErr ? '#ef4444' : '#22c55e';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function (m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        function formatFileSize(bytes) { if (!bytes) return '0 B'; const k = 1024, sizes = ['B', 'KB', 'MB', 'GB']; const i = Math.floor(Math.log(bytes) / Math.log(k)); return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i]; }
        function getFileIcon(name) { const e = name?.split('.').pop()?.toLowerCase(); if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(e)) return '🖼️'; if (['mp4', 'mov', 'avi', 'mkv'].includes(e)) return '🎥'; if (['pdf'].includes(e)) return '📕'; if (['doc', 'docx'].includes(e)) return '📘'; if (['xls', 'xlsx'].includes(e)) return '📊'; if (['txt', 'json', 'xml'].includes(e)) return '📄'; return '📎'; }

        // ФОРМАТИРОВАНИЕ ВРЕМЕНИ С УЧЕТОМ ТОЧНОСТИ
        function formatMessageDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.floor((today - msgDate) / (1000 * 60 * 60 * 24));

            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;

            if (diffDays === 0) return timeStr;
            if (diffDays === 1) return `Yesterday at ${timeStr}`;
            if (diffDays < 7) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                return `${days[date.getDay()]} at ${timeStr}`;
            }
            return `${date.getDate()}.${date.getMonth() + 1}.${date.getFullYear()} at ${timeStr}`;
        }

        // ОПРЕДЕЛЕНИЕ РЕДАКТИРОВАНИЯ - СРАВНЕНИЕ С ПОРОГОМ 1 СЕКУНДА
        function isMessageEdited(msg) {
            if (!msg.messageLastUpdateDate || !msg.messageCreateDate) return false;
            const createDate = new Date(msg.messageCreateDate);
            const updateDate = new Date(msg.messageLastUpdateDate);
            const diffMs = Math.abs(updateDate - createDate);
            return diffMs > 1000;
        }

        async function loadMessages(chatId) {
            try {
                const res = await api(`/Chat/${chatId}/messages?page=1&pageSize=100`);

        // ГЛАВНАЯ ФУНКЦИЯ ОТРИСОВКИ С ИСПРАВЛЕННОЙ ПРОВЕРКОЙ EDITED
        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            if (!messages?.length) { container.innerHTML = '<div class="empty-state">No messages yet</div>'; return; }
            const sorted = [...messages].sort((a, b) => new Date(a.messageCreateDate) - new Date(b.messageCreateDate));
            container.innerHTML = sorted.map(msg => {
                const isOwn = msg.userId === currentUser.id;
                const edited = isMessageEdited(msg);
                const avatar = API_BASE + '/User/avatar/' + msg.userId;
                const sender = msg.user?.name || msg.messageCreator?.name || 'Unknown';

                // Файловое сообщение
                if (msg.fileName) {
                    return `<div class="message ${isOwn ? 'own' : ''}" data-mid="${msg.messageId}">
                        <div class="message-header"><img src="${avatar}" onerror="this.src='${DEFAULT_AVATAR}'"><span class="message-sender">${escapeHtml(sender)}</span></div>
                        <div class="message-file">
                            <div class="file-icon">${getFileIcon(msg.fileName)}</div>
                            <div class="file-info"><div class="file-name">📁 ${escapeHtml(msg.fileName)}</div><div class="file-size">${formatFileSize(msg.fileSize)}</div></div>
                            <button class="download-btn" data-id="${msg.messageId}" data-name="${escapeHtml(msg.fileName)}">⬇️ DOWNLOAD</button>
                        </div>
                        ${msg.messageText && !msg.messageText.startsWith('📎') ? `<div class="message-caption">${escapeHtml(msg.messageText)}${edited ? ' ✏️' : ''}</div>` : ''}
                        <div class="message-time">🕐 ${formatMessageDate(msg.messageCreateDate)}</div>
                        <div class="message-actions">
                            ${isOwn ? `<button class="del-file-btn" data-id="${msg.messageId}">🗑️ Delete</button>` : ''}
                        </div>
                    </div>`;
                }
                // Системное
                if (msg.isSystemMessage) return `<div class="message system"><div class="message-content">📢 ${escapeHtml(msg.messageText)}</div><div class="message-time">${formatMessageDate(msg.messageCreateDate)}</div></div>`;
                // Текст
                const textEsc = escapeHtml(msg.messageText).replace(/'/g, "\\'");
                return `<div class="message ${isOwn ? 'own' : ''}">
                    <div class="message-header"><img src="${avatar}" onerror="this.src='${DEFAULT_AVATAR}'"><span class="message-sender">${escapeHtml(sender)}</span></div>
                    <div class="message-content">${escapeHtml(msg.messageText)}${edited ? ' <span style="font-size:10px; opacity:0.6;">✏️ edited</span>' : ''}</div>
                    <div class="message-time">${formatMessageDate(msg.messageCreateDate)}</div>
                    <div class="message-actions">
                        <button class="copy-btn" data-text="${textEsc}">📋 Copy</button>
                        ${isOwn ? `<button class="edit-msg-btn" data-id="${msg.messageId}" data-text="${textEsc}">✏️ Edit</button>` : ''}
                        ${isOwn ? `<button class="del-msg-btn" data-id="${msg.messageId}">🗑️ Delete</button>` : ''}
                    </div>
                </div>`;
            }).join('');

            // Обработчики
            document.querySelectorAll('.download-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); downloadFile(btn.dataset.id, btn.dataset.name); }); });
            document.querySelectorAll('.del-file-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); deleteMessage(btn.dataset.id); }));
            document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', () => copyToClipboard(btn.dataset.text)));
            document.querySelectorAll('.edit-msg-btn').forEach(btn => btn.addEventListener('click', () => editMessage(btn.dataset.id, btn.dataset.text)));
            document.querySelectorAll('.del-msg-btn').forEach(btn => btn.addEventListener('click', () => deleteMessage(btn.dataset.id)));
            container.scrollTop = container.scrollHeight;
        }

        async function downloadFile(messageId, fileName) {
            if (!messageId) return showToast('No file ID', true);
            showToast('⏳ Downloading...');
            try {
                const res = await fetch(`${API_BASE}/File/download/${messageId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName || 'file';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
                    showToast('✅ Downloaded!');
                } else showToast('File not found', true);
            } catch (e) { showToast('Download failed', true); }
        }

            if (!text || !currentChat) return;
            try {
                await api('/Message', { method: 'POST', body: JSON.stringify({ messageText: text, userId: currentUser.id, chatId: currentChat.id }) });
                input.value = '';
                await loadMessages(currentChat.id);
                if (connection) await connection.invoke('SendMessage', currentChat.id, currentUser.id, currentUser.name, text);
            } catch (e) { showToast('Send failed', true); }
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            const file = input.files[0];
            if (!file || !currentChat) return;
            if (file.size > 50 * 1024 * 1024) return showToast('Max 50MB', true);
            const fd = new FormData();
            fd.append('file', file);
            fd.append('chatId', currentChat.id);
            try {
                const res = await fetch(`${API_BASE}/File/upload`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd });
                if (res.ok) { input.value = ''; await loadMessages(currentChat.id); showToast('File uploaded'); }
                else showToast('Upload failed', true);
            } catch (e) { showToast('Upload error', true); }
        }

        async function showProfile() { try { const res = await api('/User/profile'); const u = await res.json(); document.getElementById('profileName').value = u.name; document.getElementById('profileNewPassword').value = ''; showModal('profileModal'); } catch (e) { showToast('Error', true); } }
        async function updateProfile() { const name = document.getElementById('profileName').value.trim(); const pwd = document.getElementById('profileNewPassword').value; const upd = {}; if (name) upd.name = name; if (pwd) upd.newPassword = pwd; if (Object.keys(upd).length === 0) return closeModals(); try { await api('/User/update-profile', { method: 'PUT', body: JSON.stringify(upd) }); const user = (await (await api('/User/profile')).json()); currentUser.name = user.name; document.getElementById('currentUserName').innerText = user.name; showToast('Profile updated'); closeModals(); } catch (e) { showToast('Error', true); } }
        async function uploadAvatar(file) { if (!file || file.size > 5 * 1024 * 1024) return showToast('Max 5MB', true); const fd = new FormData(); fd.append('file', file); try { const res = await fetch(`${API_BASE}/User/upload-avatar`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd }); if (res.ok) { const url = `${API_BASE}/User/avatar/${currentUser.id}?t=${Date.now()}`; document.getElementById('sidebarAvatar').src = url; document.getElementById('profileAvatar').src = url; showToast('Avatar updated'); } } catch (e) { showToast('Error', true); } }
        async function deleteAvatar() { if (!confirm('Remove avatar?')) return; try { await fetch(`${API_BASE}/User/avatar`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); document.getElementById('sidebarAvatar').src = DEFAULT_AVATAR; document.getElementById('profileAvatar').src = DEFAULT_AVATAR; showToast('Avatar removed'); } catch (e) { showToast('Error', true); } }

        async function initSignalR() {
            connection = new signalR.HubConnectionBuilder().withUrl("/messengerHub", { accessTokenFactory: () => token }).withAutomaticReconnect().build();
            connection.on("ReceiveMessage", () => { if (currentChat) loadMessages(currentChat.id); });
            connection.on("UserOnline", (uid, isOnline) => { onlineUsers.set(uid, isOnline); loadChats(); });
            connection.on("UserTyping", (uid, name) => { if (currentChat && uid !== currentUser.id) { const div = document.getElementById('typingIndicator'); div.innerText = `${name} typing...`; div.style.display = 'block'; clearTimeout(typingTimeout); typingTimeout = setTimeout(() => div.style.display = 'none', 2000); } });
            connection.on("UserStoppedTyping", () => { document.getElementById('typingIndicator').style.display = 'none'; });
            try { await connection.start(); if (currentChat) await connection.invoke('JoinChat', currentChat.id, currentUser.id, currentUser.name); } catch (e) { console.error(e); }
        }

        function startTyping() { if (connection && currentChat && document.getElementById('messageInput').value.length > 0) { connection.invoke('UserIsTyping', currentChat.id, currentUser.id, currentUser.name); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => connection.invoke('UserStoppedTyping', currentChat.id, currentUser.id), 1000); } }

        async function initApp() {
            if (!token) { const t = localStorage.getItem('token'), uid = localStorage.getItem('userId'); if (t && uid) { token = t; currentUser = { id: uid }; } else return; }
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            await loadUser();
            await loadChats();
            await initSignalR();
            if (typeof window.initEmojiPicker === 'function') window.initEmojiPicker();
        }

        function logout() { localStorage.clear(); token = null; currentUser = null; currentChat = null; if (connection) connection.stop(); document.getElementById('authContainer').style.display = 'flex'; document.getElementById('appContainer').classList.remove('active'); }

        // EVENT BINDINGS
        document.getElementById('doLoginBtn')?.addEventListener('click', handleLogin);
        document.getElementById('sendCodeBtn')?.addEventListener('click', requestCode);
        document.getElementById('verifyBtn')?.addEventListener('click', verifyReg);
        document.getElementById('backToRegisterBtn')?.addEventListener('click', () => { document.getElementById('verifyForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'flex'; });
        document.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
        document.getElementById('menuBtn')?.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
        document.getElementById('newChatBtn')?.addEventListener('click', () => { document.getElementById('searchUserInput').value = ''; document.getElementById('searchResults').innerHTML = ''; showModal('newChatModal'); });
        document.getElementById('createGroupBtn')?.addEventListener('click', showCreateGroup);
        document.getElementById('attachBtn')?.addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput')?.addEventListener('change', uploadFile);
        document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
        document.getElementById('messageInput')?.addEventListener('input', startTyping);
        document.getElementById('messageInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        document.getElementById('searchUserInput')?.addEventListener('input', searchUsers);
        document.getElementById('groupSearchInput')?.addEventListener('input', searchGroupUsers);
        document.getElementById('createGroupSubmit')?.addEventListener('click', createGroup);
        document.getElementById('addMemberSearch')?.addEventListener('input', searchAddMember);
        document.getElementById('saveChatEdit')?.addEventListener('click', saveChatEdit);
        document.getElementById('leaveDeleteBtn')?.addEventListener('click', leaveOrDelete);
        document.getElementById('sidebarAvatar')?.addEventListener('click', showProfile);
        document.getElementById('currentUserName')?.addEventListener('click', showProfile);
        document.getElementById('updateProfileBtn')?.addEventListener('click', updateProfile);
        document.getElementById('removeAvatarBtn')?.addEventListener('click', deleteAvatar);
        document.getElementById('profileAvatar')?.addEventListener('click', () => document.getElementById('avatarFile').click());
        document.getElementById('avatarFile')?.addEventListener('change', (e) => uploadAvatar(e.target.files[0]));
        document.getElementById('saveEditMessage')?.addEventListener('click', saveEditedMsg);
        document.querySelectorAll('.close-modal').forEach(btn => btn.addEventListener('click', closeModals));

        if (localStorage.getItem('token')) initApp();
    </script>
</body>
</html>
