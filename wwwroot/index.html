<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐺 Red Wolf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== AUTH ===== -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo">
                <span class="wolf-icon">🐺</span>
                <h1>Red Wolf</h1>
                <p>Secure &amp; Encrypted Messenger</p>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">🔐 Вход</button>
                <button class="auth-tab" data-tab="register">📝 Регистрация</button>
            </div>
            <div id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>📱 Телефон или логин</label>
                    <input type="text" id="loginLogin" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label>🔒 Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль">
                </div>
                <button class="btn btn-primary" id="doLoginBtn">→ Войти</button>
            </div>
            <div id="registerForm" class="auth-form" style="display:none">
                <div class="form-group">
                    <label>📞 Номер телефона</label>
                    <input type="tel" id="regPhone" placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label>👤 Имя</label>
                    <input type="text" id="regName" placeholder="Ваше имя">
                </div>
                <div class="form-group">
                    <label>🔒 Пароль (мин. 6)</label>
                    <input type="password" id="regPassword" placeholder="Создайте пароль">
                </div>
                <button class="btn btn-primary" id="sendCodeBtn">📨 Отправить код</button>
            </div>
            <div id="verifyForm" class="auth-form" style="display:none">
                <div class="form-group">
                    <label>🔢 Код подтверждения</label>
                    <input type="text" id="verifyCode" placeholder="Введите 6-значный код" maxlength="6">
                </div>
                <button class="btn btn-primary" id="verifyBtn">✓ Подтвердить</button>
                <button class="btn btn-secondary" id="backToRegisterBtn">← Назад</button>
            </div>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div class="app-container" id="appContainer">
        <button class="menu-btn" id="menuBtn">☰</button>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img id="sidebarAvatar" class="sidebar-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
                <h3 id="currentUserName">Загрузка...</h3>
                <button class="logout-btn" id="logoutBtn" title="Выйти">🚪</button>
            </div>
            <div class="sidebar-actions">
                <button class="btn btn-new-chat" id="newChatBtn">+ Новый чат</button>
                <button class="btn btn-create-group" id="createGroupBtn">👥 Группа</button>
                <button class="btn btn-trash" id="trashBtn">🗑️ Корзина</button>
            </div>
            <div class="chats-list" id="chatsList">
                <div class="empty-state">💬 Нет чатов<br>Начните новый диалог</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h2>✨ Выберите чат</h2>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">💭 Нет сообщений</div>
            </div>
            <div class="typing-indicator" id="typingIndicator" style="display:none"></div>
            <div class="message-input-area">
                <input type="file" id="fileInput" style="display:none">
                <button class="icon-btn" id="attachBtn" title="Файл">📎</button>
                <div class="emoji-picker-container">
                    <button class="icon-btn" id="emojiBtn" title="Emoji">😊</button>
                </div>
                <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
                <button class="icon-btn send-btn" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <!-- ===== MODALS ===== -->
    <div class="modal" id="trashModal">
        <div class="modal-content">
            <h3>🗑️ Корзина - <span id="trashChatName"></span></h3>
            <div id="deletedMessagesList" style="max-height:60vh;overflow-y:auto;">
                <div class="empty-state">📭 Нет удалённых сообщений</div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="refreshTrashBtn">🔄 Обновить</button>
                <button class="btn btn-secondary close-modal">✖️ Закрыть</button>
            </div>
        </div>
    </div>

    <div class="modal" id="userProfileModal">
        <div class="modal-content">
            <div id="userProfileContent"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary close-modal">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="modal" id="newChatModal">
        <div class="modal-content">
            <h3>🔍 Новый чат</h3>
            <div class="form-group">
                <input type="text" id="searchUserInput" placeholder="Поиск по имени...">
            </div>
            <div id="searchResults"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary close-modal">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <h3>👥 Создать группу</h3>
            <div class="form-group">
                <input type="text" id="groupName" placeholder="Название группы">
            </div>
            <div class="form-group">
                <input type="number" id="groupMaxUsers" value="100" placeholder="Макс. участников">
            </div>
            <div class="form-group">
                <input type="text" id="groupSearchInput" placeholder="Поиск участников...">
            </div>
            <div id="groupSearchResults"></div>
            <div id="selectedMembers" class="selected-members"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="createGroupSubmit">✨ Создать</button>
                <button class="btn btn-secondary close-modal">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editChatModal">
        <div class="modal-content">
            <h3 id="editChatTitle">✏️ Редактировать</h3>
            <div class="form-group">
                <input type="text" id="editChatName" placeholder="Название">
            </div>
            <div id="groupAvatarSection" style="display:none;text-align:center;margin:16px 0;">
                <img id="groupAvatarPreview" class="group-avatar-img" src="">
                <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                    <button class="btn btn-secondary" id="uploadGroupAvatarBtn">📷 Загрузить</button>
                    <button class="btn btn-danger" id="deleteGroupAvatarBtn">🗑️ Удалить</button>
                </div>
                <input type="file" id="groupAvatarFile" accept="image/*" style="display:none">
            </div>
            <div id="groupMembersSection" style="display:none">
                <div class="form-group">
                    <input type="text" id="addMemberSearch" placeholder="Добавить участника...">
                </div>
                <div id="addMemberResults"></div>
                <div id="membersList"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="saveChatEdit">💾 Сохранить</button>
                <button class="btn btn-danger" id="leaveDeleteBtn">🚪 Покинуть</button>
                <button class="btn btn-secondary close-modal">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h3>👤 Мой профиль</h3>
            <div style="text-align:center">
                <img id="profileAvatar" class="profile-avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7280'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
                <input type="file" id="avatarFile" accept="image/*" style="display:none">
                <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                    <button class="btn btn-secondary" id="uploadAvatarBtn">📷 Загрузить</button>
                    <button class="btn btn-danger" id="removeAvatarBtn">🗑️ Удалить</button>
                </div>
            </div>
            <div class="form-group" style="margin-top:20px;">
                <label>Имя</label>
                <input type="text" id="profileName" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <label>Новый пароль (оставьте пустым)</label>
                <input type="password" id="profileNewPassword" placeholder="Новый пароль">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="updateProfileBtn">💾 Сохранить</button>
                <button class="btn btn-secondary close-modal">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editMessageModal">
        <div class="modal-content">
            <h3>✏️ Редактировать</h3>
            <textarea id="editMessageText" rows="3" style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;color:var(--text);font-family:inherit;resize:none;font-size:14px;"></textarea>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="saveEditMessage">💾 Сохранить</button>
                <button class="btn btn-secondary close-modal">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
